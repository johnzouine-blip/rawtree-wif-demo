name: RawTree Workload Identity Federation

on:
  workflow_dispatch:

run-name: RawTree WIF · ${{ github.ref_name }}

permissions:
  contents: read
  id-token: write

jobs:
  workload-identity-demo:
    name: GitHub OIDC → RawTree → SQL
    runs-on: ubuntu-latest
    env:
      RAWTREE_URL: ${{ vars.RAWTREE_URL }}
      RAWTREE_FEDERATION_RULE_ID: ${{ vars.RAWTREE_FEDERATION_RULE_ID }}
      RAWTREE_AUDIENCE: ${{ vars.RAWTREE_AUDIENCE }}
      RAWTREE_DATABASE: analytics
    steps:
      - name: Run RawTree WIF demonstration
        shell: bash
        run: |
          set -euo pipefail

          : "${RAWTREE_URL:?Add repository variable RAWTREE_URL}"
          : "${RAWTREE_FEDERATION_RULE_ID:?Add repository variable RAWTREE_FEDERATION_RULE_ID}"
          : "${RAWTREE_AUDIENCE:?Add repository variable RAWTREE_AUDIENCE}"
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC is unavailable}"

          echo ""
          echo "============================================================"
          echo "  1/3  GITHUB OIDC AUTHENTICATION"
          echo "============================================================"
          echo "Requesting a GitHub identity assertion..."
          OIDC_RESPONSE="$(curl --fail-with-body --silent --show-error --get \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${RAWTREE_AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          OIDC_ASSERTION="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_RESPONSE")"
          unset OIDC_RESPONSE
          echo "GitHub issued the assertion. Decoded identity claims:"
          python -c 'import base64,json,sys; t=sys.stdin.read().strip(); p=t.split(".")[1]; p += "="*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ("iss","aud","sub")}, indent=2))' <<< "$OIDC_ASSERTION"
          echo "SUCCESS: GitHub identity received (JWT value hidden)."

          echo ""
          echo "============================================================"
          echo "  2/3  RAWTREE TOKEN EXCHANGE"
          echo "============================================================"
          echo "Exchanging the GitHub assertion with RawTree..."
          EXCHANGE_RESPONSE="$(curl --silent --show-error --write-out '__HTTP_STATUS__%{http_code}' \
            -X POST "${RAWTREE_URL%/}/oauth/token" \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "federation_rule_id=${RAWTREE_FEDERATION_RULE_ID}" \
            --data-urlencode "assertion=${OIDC_ASSERTION}")"
          unset OIDC_ASSERTION

          EXCHANGE_HTTP_STATUS="${EXCHANGE_RESPONSE##*__HTTP_STATUS__}"
          EXCHANGE_BODY="${EXCHANGE_RESPONSE%__HTTP_STATUS__*}"
          if [[ "$EXCHANGE_HTTP_STATUS" != "200" ]]; then
            echo "FAILED: RawTree token exchange returned HTTP ${EXCHANGE_HTTP_STATUS}."
            python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({k:d[k] for k in ("error","error_description","message","detail","code") if k in d}) or "RawTree returned an error response without a standard message.")' <<< "$EXCHANGE_BODY"
            exit 1
          fi

          RAWTREE_ACCESS_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$EXCHANGE_BODY")"
          TOKEN_TYPE="$(python -c 'import json,sys; print(json.load(sys.stdin).get("token_type", ""))' <<< "$EXCHANGE_BODY")"
          EXPIRES_IN="$(python -c 'import json,sys; print(json.load(sys.stdin).get("expires_in", ""))' <<< "$EXCHANGE_BODY")"
          unset EXCHANGE_RESPONSE EXCHANGE_BODY

          if [[ "$TOKEN_TYPE" != "Bearer" ]]; then
            echo "FAILED: RawTree returned an unexpected token type."
            exit 1
          fi

          echo "SUCCESS: RawTree issued a short-lived bearer token."
          echo "Token lifetime: ${EXPIRES_IN} seconds. Token value is never printed."

          echo ""
          echo "============================================================"
          echo "  3/3  SQL EXECUTION"
          echo "============================================================"
          echo "Running SELECT 42 AS value against ${RAWTREE_DATABASE}..."
          QUERY_RESPONSE="$(curl --silent --show-error --write-out '__HTTP_STATUS__%{http_code}' \
            -X POST "${RAWTREE_URL%/}/v1/query" \
            -H "Authorization: Bearer ${RAWTREE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "x-rawtree-database: ${RAWTREE_DATABASE}" \
            --data '{"sql":"SELECT 42 AS value"}')"
          unset RAWTREE_ACCESS_TOKEN

          QUERY_HTTP_STATUS="${QUERY_RESPONSE##*__HTTP_STATUS__}"
          QUERY_BODY="${QUERY_RESPONSE%__HTTP_STATUS__*}"
          if [[ "$QUERY_HTTP_STATUS" != "200" ]]; then
            echo "FAILED: RawTree query returned HTTP ${QUERY_HTTP_STATUS}."
            echo "RawTree error response (no credentials included):"
            python -m json.tool <<< "$QUERY_BODY" || head -c 4000 <<< "$QUERY_BODY"
            exit 1
          fi

          python -c 'import json,sys; r=json.load(sys.stdin); rows=r.get("data", []); ok=bool(rows) and rows[0].get("value")==42; print("SUCCESS: Query returned value = 42." if ok else "Unexpected query result: "+json.dumps(r)); sys.exit(0 if ok else 1)' <<< "$QUERY_BODY"

          echo ""
          echo "============================================================"
          echo "  DEMO COMPLETE: GitHub OIDC → RawTree → SQL  ✓"
          echo "============================================================"
